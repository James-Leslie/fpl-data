repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: uvx ruff check --fix
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff-format
        entry: uvx ruff format
        language: system
        types: [python]
        pass_filenames: false
      - id: ty
        name: ty
        entry: uvx ty check src/
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
