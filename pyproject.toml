[project]
name = "fpl-data"
version = "0.3.1"
description = "Tools for working with Fantasy Premier League data"
readme = "README.md"
authors = [
    { name = "James Leslie", email = "contactjamesleslie@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "jsonschema>=4.25.1",
    "numpy>=2.0.2",
    "pandas>=2.3.2",
    "requests>=2.32.5",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "mypy>=1.17.1",
    "pandas-stubs>=2.2.2.240807",
    "pydantic>=2.11.7",
    "pytest>=8.4.1",
    "ruff>=0.12.10",
    "types-requests>=2.32.4.20250809",
    "types-tqdm>=4.67.0.20250809",
]
