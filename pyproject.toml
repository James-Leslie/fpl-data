[project]
name = "fpl-data"
version = "0.3.0"
description = "Tools for working with Fantasy Premier League data"
readme = "README.md"
authors = [
    { name = "James Leslie", email = "contactjamesleslie@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "jsonschema>=4.25.1",
    "numpy>=2.0.2",
    "pandas>=2.3.2",
    "requests>=2.32.5",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
]
